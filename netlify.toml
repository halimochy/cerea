# ================================================================
# Netlify configuration for the Cerea frontend (React + Vite)
# Netlify hosts only the static site. The FastAPI backend and the
# MariaDB/MySQL database must run elsewhere (see README → Deployment).
# ================================================================

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"   # Vite 7 needs Node 20.19+

# ── API proxy ───────────────────────────────────────────────────
# The app calls the backend at /api/*. Once your backend is deployed,
# uncomment this rule and replace the URL. It must come BEFORE the
# catch-all rule below. The ":splat" keeps the path and strips "/api".
#
[[redirects]]
  from   = "/api/*"
  to     = "https://cerea-tawny.vercel.app/:splat"
  status = 200
  force  = true

# ── Single-page app fallback ────────────────────────────────────
# Lets deep links such as /user-portal work after a page refresh.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Basic security headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
